<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17191d"><meta name="description" content="Понятный план тарифных кампаний на основе пилотов для кейса Beeline.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='14' fill='%23ffd400'/%3E%3Cpath d='M13 14h22v7H21v4h12v7H21v4H13z' fill='%2317191d'/%3E%3C/svg%3E">
  <title>Beeline · План кампаний</title>
  <style>
    :root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#1b1c20;background:#f3f4f5;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0;font-size:16px;line-height:1.5}.shell{max-width:1440px;margin:auto;min-height:100vh;display:grid;grid-template-columns:226px 1fr;background:#f3f4f5}.sidebar{background:#17191d;color:#fff;padding:27px 18px;display:flex;flex-direction:column;gap:28px}.brand{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:750}.mark{width:34px;height:34px;border-radius:11px;background:#ffd400;color:#17191d;display:grid;place-items:center;font-weight:900}.brand small{display:block;color:#aeb0b5;font-size:12px;font-weight:450;margin-top:1px}.nav{padding:12px 13px;border-radius:11px;background:#292b30;color:#ffd400;font-size:14px}.side-note{margin-top:auto;padding:13px;border:1px solid #3a3c40;border-radius:12px;color:#c2c3c6;font-size:13px}.main{min-width:0}.top{height:66px;border-bottom:1px solid #e4e5e7;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 34px;color:#62646a;font-size:14px}.status{display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:#20a66a}.content{max-width:1170px;margin:0 auto;padding:30px 34px 54px}.heading{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:23px}.eyebrow{font-size:13px;color:#74767c;margin-bottom:5px}.heading h1{font-size:29px;line-height:1.2;letter-spacing:-.7px;margin:0;font-weight:730}.run{background:#ffd400;border:0;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;color:#17191d}.run:hover{background:#efc700}.run:disabled{opacity:.6;cursor:wait}.alert{background:#fff8d6;border:1px solid #ecd98a;padding:12px 15px;border-radius:11px;font-size:13px;color:#655517;margin-bottom:17px}.recommend{background:#fff;border:1px solid #e3e4e6;border-radius:15px;padding:20px 22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;margin-bottom:16px}.recommend h2{margin:0 0 6px;font-size:17px}.recommend p{margin:0;color:#55575d;max-width:770px;font-size:15px}.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#707278;margin-bottom:6px}.stamp{background:#fff2a6;border-radius:9px;padding:9px 12px;font-size:12px;white-space:nowrap}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metric,.card{background:white;border:1px solid #e4e5e7;border-radius:14px}.metric{padding:16px 17px}.metric .label{margin-bottom:7px}.value{font-size:23px;letter-spacing:-.5px;font-weight:720}.sub{font-size:12px;color:#75777c;margin-top:2px}.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(270px,.9fr);gap:16px}.card{overflow:hidden}.cardhead{padding:17px 19px;border-bottom:1px solid #ececee;display:flex;justify-content:space-between;align-items:center}.cardhead h2{font-size:16px;margin:0}.cardhead span{font-size:12px;color:#777980}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:630px}th{text-align:left;background:#fafafa;color:#777980;font-size:12px;font-weight:600;padding:11px 13px;white-space:nowrap}td{padding:13px;border-top:1px solid #efeff0;vertical-align:middle;font-size:14px}.segment{font-weight:680}.detail{font-size:12px;color:#777980;margin-top:2px}.pill{display:inline-block;border-radius:20px;padding:4px 9px;background:#f0f1f2;font-size:12px;white-space:nowrap}.good{background:#e8f6ef;color:#187448}.muted{color:#85878c}.sidecard{padding:17px 19px}.sidecard h2{font-size:16px;margin:0 0 12px}.channel{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #eee;font-size:14px}.channel:last-child{border-bottom:0}.channel strong{font-weight:650}.channel small{display:block;color:#7a7c81;font-size:12px}.history{margin-top:16px}.history table{min-width:500px}.footnote{font-size:12px;color:#73757a;margin-top:18px;line-height:1.55}.empty{padding:24px;text-align:center;color:#777;font-size:14px}.error{color:#a12525;background:#fff0ef;border:1px solid #f0cdca;border-radius:12px;padding:16px}@media(max-width:900px){.shell{grid-template-columns:185px 1fr}.content{padding:24px 20px}.top{padding:0 20px}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:620px){.shell{display:block}.sidebar{padding:13px 16px;flex-direction:row;align-items:center;gap:18px}.nav{margin-left:auto;padding:9px 11px}.side-note{display:none}.top{height:48px;padding:0 16px;font-size:12px}.content{padding:20px 14px 38px}.heading{align-items:flex-start;flex-direction:column;margin-bottom:16px}.heading h1{font-size:25px}.run{width:100%}.recommend{grid-template-columns:1fr;padding:17px}.stamp{justify-self:start}.metrics{gap:9px}.metric{padding:13px}.value{font-size:20px}.metric .label{font-size:11px}.cardhead{padding:14px}.sidecard{padding:15px}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="mark">B</span><span>Beeline<small>Campaign Copilot</small></span></div>
    <div class="nav">▦ &nbsp; План кампаний</div>
    <div class="side-note">Учебный кейс HackAlem<br>Рекомендации строятся по пилотам и лимитам задания.</div>
  </aside>
  <main class="main">
    <div class="top"><span>Маркетинговая аналитика</span><span class="status"><i class="dot"></i>Демо-режим</span></div>
    <div class="content" id="app"><div class="empty">Загружаю план кампаний…</div></div>
  </main>
</div>
<script>
const fmt = n => new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(n||0);
const seg = {LOW:'низкий ARPU',MID:'средний ARPU',HIGH:'высокий ARPU'};
const channel = {push:'Push',sms:'SMS',digital_ads:'Реклама',call:'Звонок'};
function campaignRows(list){if(!list.length)return '<tr><td colspan="5" class="empty">Агент не сформировал кампании с положительным ожидаемым результатом.</td></tr>';return list.map((c,i)=>`<tr><td><span class="segment">${seg[c.filter_arpu_segment]||'Все сегменты'}</span><div class="detail">${c.filter_data_segment?({HEAVY:'много интернета',LITE:'мало интернета',NON_USER:'без интернета'}[c.filter_data_segment]||'')+' · ':''}${c.filter_current_tariff||'все тарифы'}</div></td><td><strong>${c.target_tariff.replace('tariff_','Тариф ')}</strong><div class="detail">${c.tariff_label}</div></td><td><span class="pill">${c.channel_label}</span></td><td>${fmt(c.audience_size)}</td><td>${c.pilot_count?`<span class="pill good">${c.pilot_count} пилот${c.pilot_count===1?'':'а'}</span>`:'<span class="muted">нет</span>'}</td></tr>`).join('')}
function render(d){const s=d.summary;document.getElementById('app').innerHTML=`<div class="heading"><div><div class="eyebrow">Кейс тарифных маркетинговых кампаний</div><h1>План на следующий месяц</h1></div><button class="run" id="rerun">↻ &nbsp; Пересчитать рекомендации</button></div>
<div class="alert">Учебная симуляция: данные, тарифы, суммы и эффекты синтетические и не являются показателями реального Beeline. История клиентов взята из другой выборки — агент использует её только как слабую подсказку.</div>
<section class="recommend"><div><div class="label">Что предлагает агент</div><h2>План после проверки гипотез</h2><p>${s.recommendation}</p></div><span class="stamp">${s.pilots} пилотов проведено</span></section>
<section class="metrics"><div class="metric"><div class="label">Абонентов в базе</div><div class="value">${fmt(s.customers)}</div><div class="sub">целевая аудитория кейса</div></div><div class="metric"><div class="label">Рекомендовано кампаний</div><div class="value">${s.campaigns} <span class="sub">из 10 максимум</span></div><div class="sub">сегменты без повторного охвата</div></div><div class="metric"><div class="label">Расход бюджета</div><div class="value">${fmt(s.spent)} <span class="sub">/ 100 000 у.е.</span></div><div class="sub">пилоты ${fmt(s.pilot_spend)} · кампании ${fmt(s.campaign_spend)}</div></div><div class="metric"><div class="label">Контакты</div><div class="value">${fmt(s.contacts)} <span class="sub">/ 15 000</span></div><div class="sub">включая ${fmt(s.pilot_contacts)} пилотных</div></div></section>
<div class="grid"><section class="card"><div class="cardhead"><h2>Предложенные кампании</h2><span>аудитория · тариф · канал</span></div><div class="tablewrap"><table><thead><tr><th>Кому</th><th>Какой тариф</th><th>Канал</th><th>Абонентов</th><th>Проверка</th></tr></thead><tbody>${campaignRows(d.campaigns)}</tbody></table></div></section>
<section class="card"><div class="sidecard"><h2>Стоимость контакта</h2>${d.channels.map(c=>`<div class="channel"><span><strong>${c.name}</strong><small>множитель эффекта ${c.effect}</small></span><span>${c.cost===0?'Бесплатно':fmt(c.cost)+' у.е.'}</span></div>`).join('')}<div class="footnote">Агент сначала сравнивает результаты пилотов, затем выбирает канал с учётом его стоимости. Больший множитель эффекта не всегда означает лучший чистый результат.</div></div></section></div>
<section class="card history"><div class="cardhead"><h2>Результаты пилотов</h2><span>фактические наблюдения демо-запуска</span></div><div class="tablewrap"><table><thead><tr><th>Гипотеза</th><th>Канал</th><th>Выборка</th><th>Наблюдаемый эффект</th><th>Стоимость</th></tr></thead><tbody>${d.pilots.length?d.pilots.map(p=>`<tr><td>${p.target_tariff.replace('tariff_','Тариф ')} · ${seg[p.filter_arpu_segment]||'сегмент'}</td><td>${channel[p.channel]}</td><td>${fmt(p.n_customers)}</td><td>${(p.observed_lift_ratio*100).toFixed(1)}%</td><td>${fmt(p.cost)} у.е.</td></tr>`).join(''):'<tr><td colspan="5" class="empty">Пилотов в этом запуске нет.</td></tr>'}</tbody></table></div></section>
<p class="footnote">Наблюдаемый эффект — шумная оценка на небольшой выборке, а не обещание роста ARPU. Итоговый результат на демо-среде может отличаться от проверки хакатона. Для реального решения используйте официальный оценщик кейса.</p>`;document.getElementById('rerun').onclick=load}
async function load(){const app=document.getElementById('app');const btn=document.getElementById('rerun');if(btn)btn.disabled=true;try{const r=await fetch('/api/recommendations');const d=await r.json();if(!r.ok)throw Error(d.error||'Не удалось получить рекомендации');render(d)}catch(e){app.innerHTML=`<div class="error">Не удалось загрузить рекомендации. Проверьте, что демонстрационный сайт запущен.<br><span class="detail">${e.message}</span></div>`}}
load();
</script>
</body>
</html>
